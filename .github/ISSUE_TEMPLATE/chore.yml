name: 🔧 Chore
description: Maintenance, refactoring, or infrastructure work
title: "[Chore] "
labels: ["type/chore", "status/triage"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template for maintenance tasks, refactoring, or infrastructure improvements.

  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What needs to be done?
      placeholder: Describe the maintenance task...
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: How will we know when this is complete?
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which area?
      options:
        - Pipeline Stage
        - CLI / Orchestrator
        - Dataset Catalog
        - Documentation
        - Infrastructure / CI
    validations:
      required: true
