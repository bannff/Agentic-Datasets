name: Nightly Pipeline (manual)

on:
  workflow_dispatch:
    inputs:
      config_path:
        description: Override YAML pipeline config path
        required: false
        default: ''

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Run pipeline
        shell: bash
        run: |
          DEFAULT_CONFIG="${NIGHTLY_CONFIG_PATH:-}"
          CONFIG_PATH="${{ inputs.config_path }}"
          if [ -z "$CONFIG_PATH" ]; then
            CONFIG_PATH="${DEFAULT_CONFIG:-examples/pipeline.example.yaml}"
          fi
          echo "Using pipeline config: $CONFIG_PATH"
          python -m agentic_datasets.cli run-config "$CONFIG_PATH"
      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-outputs
          path: |
            examples/out*.jsonl
            **/out*.jsonl