name: Nightly Pipeline

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      config_path:
        description: Override YAML pipeline config path
        required: false
        default: ''

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Run pipeline
        shell: bash
        env:
          NIGHTLY_CONFIG_PATH: ${{ vars.NIGHTLY_CONFIG_PATH }}
        run: |
          DEFAULT_CONFIG="${NIGHTLY_CONFIG_PATH:-}"
          CONFIG_PATH="${{ inputs.config_path }}"
          if [ -z "$CONFIG_PATH" ]; then
            CONFIG_PATH="${DEFAULT_CONFIG:-examples/pipeline.example.yaml}"
          fi
          echo "Using pipeline config: $CONFIG_PATH"
          python -m agentic_datasets.cli run-config "$CONFIG_PATH"
      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-outputs
          path: |
            examples/out*.jsonl
            **/out*.jsonl
      - name: Optional publish to HF
        if: ${{ vars.PUBLISH_ENTRY_ID != '' && vars.PUBLISH_REPO_ID != '' && vars.PUBLISH_DATA_PATH != '' }}
        env:
          HUGGINGFACE_HUB_TOKEN: ${{ secrets.HUGGINGFACE_HUB_TOKEN }}
          PUBLISH_ENTRY_ID: ${{ vars.PUBLISH_ENTRY_ID }}
          PUBLISH_REPO_ID: ${{ vars.PUBLISH_REPO_ID }}
          PUBLISH_DATA_PATH: ${{ vars.PUBLISH_DATA_PATH }}
        run: |
          python -m agentic_datasets.cli hf:push "$PUBLISH_ENTRY_ID" "$PUBLISH_REPO_ID" "$PUBLISH_DATA_PATH"