name: End-to-End Pipeline Test

on:
  workflow_dispatch:
  push:
    paths:
      - 'examples/**'
      - 'src/agentic_datasets/**'

jobs:
  e2e-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      
      - name: Test 1 - Basic Pipeline (Ingest → Normalize → Export)
        run: |
          python -m agentic_datasets.cli run \
            examples/single_turn_cybersec.jsonl \
            /tmp/test1_output.jsonl
          echo "✅ Basic pipeline works"
          cat /tmp/test1_output.jsonl
      
      - name: Test 2 - Chunking Pipeline
        run: |
          python -m agentic_datasets.cli chunk \
            examples/sample.jsonl \
            /tmp/test2_chunked.jsonl \
            --max-tokens 100 \
            --overlap 20
          echo "✅ Chunking works"
          wc -l /tmp/test2_chunked.jsonl
      
      - name: Test 3 - YAML Pipeline with Stages (S2M → APIGenMT → ReviewInstruct)
        run: |
          cat > /tmp/agentic_pipeline.yaml << 'EOF'
          input: examples/single_turn_cybersec.jsonl
          output: /tmp/test3_agentic.jsonl
          orchestrator: strands
          stages:
            - name: s2m
            - name: apigenmt
            - name: reviewinstruct
          EOF
          python -m agentic_datasets.cli run-config /tmp/agentic_pipeline.yaml
          echo "✅ Stage pipeline executes (NOTE: stages are stubs)"
          cat /tmp/test3_agentic.jsonl
      
      - name: Test 4 - Catalog Operations
        run: |
          python -m agentic_datasets.cli catalog:list catalog.yaml
          python -m agentic_datasets.cli catalog:show sample-conversations catalog.yaml
          echo "✅ Catalog commands work"
      
      - name: Test 5 - Validation
        run: |
          python -m agentic_datasets.cli validate examples/sample.jsonl --max-records 5
          echo "✅ Validation works"
      
      - name: Summary - What Actually Transformed
        run: |
          echo "=== INPUT (Single-Turn) ==="
          head -n 2 examples/single_turn_cybersec.jsonl
          echo ""
          echo "=== OUTPUT (After S2M → APIGenMT → ReviewInstruct) ==="
          head -n 2 /tmp/test3_agentic.jsonl
          echo ""
          echo "⚠️  REALITY CHECK:"
          echo "- S2M: Adds placeholder assistant message (NOT real multi-turn)"
          echo "- APIGenMT: Sets metadata flag (NO tool calls injected)"
          echo "- ReviewInstruct: Sets metadata flag (NO refinement)"
          echo "- Result: Minimal transformation - stages are STUBS"
      
      - name: Upload test outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-outputs
          path: |
            /tmp/test*.jsonl
            /tmp/agentic_pipeline.yaml
