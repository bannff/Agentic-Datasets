name: Run Agentic Pipeline (on-demand)

on:
  workflow_dispatch:
    inputs:
      config_path:
        description: Path to YAML pipeline config file
        required: true
        default: examples/pipeline.example.yaml

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Execute pipeline
        run: |
          python -m agentic_datasets.cli run-config "${{ inputs.config_path }}"
      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-outputs
          path: |
            examples/out*.jsonl
            **/out*.jsonl
