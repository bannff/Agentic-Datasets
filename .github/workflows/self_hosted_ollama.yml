name: Self-Hosted Ollama Pipeline

on:
  workflow_dispatch:
    inputs:
      config:
        description: Path to pipeline YAML
        required: false
        default: examples/pipeline.ollama.yaml
      model:
        description: Ollama model to use (must be pre-pulled on runner)
        required: false
        default: qwen3:8b

jobs:
  run-pipeline:
    runs-on: [self-hosted, ollama]
    concurrency:
      group: self-hosted-ollama-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies (ollama extra)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[ollama]"

      - name: Verify Ollama service
        run: |
          # Check basic health/version endpoint without requiring jq
          curl -fsS http://localhost:11434/api/version || (echo "Ollama not reachable on localhost:11434" && exit 1)

      - name: Preflight model
        env:
          OLLAMA_HOST: http://localhost:11434
        run: |
          bash scripts/runner_preflight_ollama.sh "${{ github.event.inputs.model }}"

      - name: Run pipeline
        env:
          OLLAMA_HOST: http://localhost:11434
        run: |
          python -m agentic_datasets.cli run-config "${{ github.event.inputs.config }}"

      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-outputs-${{ github.run_number }}
          path: |
            examples/out*.jsonl
            **/out*.jsonl