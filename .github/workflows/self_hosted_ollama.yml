name: Self-Hosted Ollama Pipeline

on:
  workflow_dispatch:
    inputs:
      config:
        description: Path to pipeline YAML
        required: false
        default: examples/pipeline.ollama.yaml

jobs:
  run-pipeline:
    runs-on: [self-hosted, ollama]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies (ollama extra)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[ollama]"

      - name: Verify Ollama service
        run: |
          # Check basic health/version endpoint without requiring jq
          curl -fsS http://localhost:11434/api/version || (echo "Ollama not reachable on localhost:11434" && exit 1)

      - name: Check model availability (qwen3:8b)
        run: |
          # Ensure the model is present on the runner; fail with actionable message if missing
          curl -fsS http://localhost:11434/api/tags | grep -q '"model":"qwen3:8b"' \
            || { echo "Model qwen3:8b not present on the runner. Pre-pull it: 'ollama pull qwen3:8b'"; exit 1; }

      - name: Run pipeline
        env:
          OLLAMA_HOST: http://localhost:11434
        run: |
          python -m agentic_datasets.cli run-config "${{ github.event.inputs.config }}"

      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-outputs
          path: |
            examples/out*.jsonl
            **/out*.jsonl