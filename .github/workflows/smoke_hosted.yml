name: Smoke (Hosted)

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint (ruff)
        run: |
          python -m ruff --version || true
          python -m ruff check --quiet || true
      - name: Typecheck (mypy)
        run: |
          python -m mypy --version || true
          python -m mypy || true
      - name: Tests
        run: |
          python -m pytest -q
      - name: Run deterministic pipeline example
        run: |
          python -m agentic_datasets.cli run-config examples/pipeline.example.yaml