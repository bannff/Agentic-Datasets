name: Smoke Test (Docker)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: agentic-datasets:test

      - name: Run example pipeline (local orchestrator)
        run: |
          docker run --rm -v ${{ github.workspace }}:/app agentic-datasets:test \
            run-config examples/pipeline.example.yaml

      - name: Run agentic pipeline (strands orchestrator)
        run: |
          docker run --rm -e BYPASS_TOOL_CONSENT=true -v ${{ github.workspace }}:/app agentic-datasets:test \
            run-config examples/pipeline.agentic.yaml
