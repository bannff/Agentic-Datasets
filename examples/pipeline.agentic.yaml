input: examples/sample.jsonl
output: examples/out.agentic.jsonl
orchestrator: strands
stages:
  - name: agentinstruct
    params:
      k_variants: 2
  - name: s2m
  - name: apigenmt
  - name: reviewinstruct
  - name: chunk
    params:
      model_name: gpt-4o-mini
      max_tokens: 256
      overlap: 32